[project]
name = "agvs4rtl"
version = "0.1.0"
description = "Multi-Agent System for RTL Auto-Generation and Verification"
readme = "README.md"
requires-python = ">=3.11"
# 这里定义所有 Agent 共用的核心依赖
dependencies = [
    "pydantic>=2.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "langgraph>=0.0.10",
    "pyverilog>=1.3.0",
]

[project.optional-dependencies]
# Parser 专有
parser = [
    "semantic-router>=0.0.20",
]
# Verify 专有
verify = [
    "cocotb>=1.8.0",
    "cocotb-test>=0.2.4",
    "pytest>=7.4.0",
]

[tool.uv]
managed = true