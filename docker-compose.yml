version: '3.8'

services:
  # 服务 1: 核心智能体
  agent-core:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    container_name: hdl_agent_core
    volumes:
      - ./app:/app/app          # 代码热重载：本地改代码，容器内生效
      - ./data:/app/data        # 数据共享
      - /var/run/docker.sock:/var/run/docker.sock # 关键：让大脑能控制 Docker
    env_file:
      - .env
    depends_on:
      - eda-sandbox
    command: tail -f /dev/null  # 保持运行，方便你进入调试，或者设为 python app/main.py
    networks:
      - hdl_net

  # 服务 2: 仿真沙盒
  eda-sandbox:
    build:
      context: .
      dockerfile: deploy/sandbox.Dockerfile
    container_name: hdl_sandbox
    volumes:
      - ./data/workspace:/workspace # 共享工作区，让大脑能读到仿真结果
    command: tail -f /dev/null  # 静默待命
    networks:
      - hdl_net

networks:
  hdl_net:
    driver: bridge