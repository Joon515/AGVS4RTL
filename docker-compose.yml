services:
  # 服务 1: 大脑 (Python 3.12)
  agent-core:
    build:
      context: .                # 上下文：根目录
      dockerfile: deploy/app.Dockerfile
    image: hdl-agent-core:latest
    container_name: hdl_agent_core
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    stdin_open: true
    tty: true
    volumes:
      - ./app:/app/app          # 源码热重载
      - ./data:/app/data        # 数据共享
      - /var/run/docker.sock:/var/run/docker.sock # 控制权
    depends_on:
      - eda-sandbox
    # 默认命令：保持运行，用于进入容器测试
    command: tail -f /dev/null
    networks:
      - hdl_net

  # 服务 2: 肌肉 (Verilator/Python 3.12)
  eda-sandbox:
    build:
      context: .                # 上下文：根目录
      dockerfile: deploy/sandbox.Dockerfile
    image: hdl-eda-sandbox:latest
    container_name: hdl_sandbox
    volumes:
      - ./data/workspace:/workspace # 共享工作区
    # 静默运行，等待被大脑调用
    command: tail -f /dev/null
    networks:
      - hdl_net

networks:
  hdl_net:
    driver: bridge