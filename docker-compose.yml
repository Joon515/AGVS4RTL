services:
  # Parser Agent: LangGraph 中枢与意图解析（对外唯一入口，宿主机端口 8001）
  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile.parser
    image: agvs4rtl-parser
    container_name: agvs4rtl_parser
    user: "${USER_ID}:${GROUP_ID}"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - GEN_SERVICE_URL=http://gen:8000
      - VERIFY_SERVICE_URL=http://verify:8000
      - VERIFY_SERVICE_TIMEOUT_SECONDS=240
      - GEN_SERVICE_TIMEOUT_SECONDS=600
      - AGVS4RTL_LLM_TIMEOUT_SECONDS=300
    ports:
      - "8001:8000"
    command: python -m uvicorn src.parser.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
      - ./shared_workspace:/app/shared_workspace:rw
      - ./Output:/app/Output:rw
    depends_on:
      - gen
      - verify

  # Gen Agent: Architect + Coding 内部服务（仅容器内可见）
  gen:
    build:
      context: .
      dockerfile: docker/Dockerfile.gen
    image: agvs4rtl-gen
    container_name: agvs4rtl_gen
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - PYTHONPATH=/app
    expose:
      - "8000"
    command: python -m uvicorn src.generator.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
      - ./shared_workspace:/app/shared_workspace:rw
      - ./Output:/app/Output:rw

  # Verify Agent: 自动化验证内部服务（仅容器内可见）
  verify:
    build:
      context: .
      dockerfile: docker/Dockerfile.verify
    image: agvs4rtl-verify
    container_name: agvs4rtl_verify
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - PYTHONPATH=/app
      - VERIFY_ENABLE_IVERILOG=true
    expose:
      - "8000"
    command: python -m uvicorn src.verify.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
      - ./shared_workspace:/app/shared_workspace:rw
      - ./Output:/app/Output:rw